<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>MatUlanzi.HomeAssistant self-test</title>
    <script src="fixtures.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/ha-client.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/ha-registry.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/ha-domains.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/ha-capabilities.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/mdi-icons.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/property-inspector/common/color-controls.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/property-inspector/common/cover-control.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/display-rules.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/ha-services.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/action-presets.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/switch-plan.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/target-context.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/ha-links.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/control-window.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/key-style.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/library.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/key-renderer.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/i18n.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/ha-pool.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/actions/key-action.js"></script>
    <script src="../com.ulanzi.matUlanziHa.ulanziPlugin/plugin/src/designer-window.js"></script>
    <style>
      body {
        background: #1e1f22;
        color: #eceef0;
        font: 14px 'Segoe UI', sans-serif;
        padding: 18px;
      }
      h2 { font-size: 15px; margin: 22px 0 8px; color: #9aa0a6; }
      .pass { color: #3ddc97; }
      .fail { color: #ff5c5c; font-weight: 600; }
      pre { background: #26282d; padding: 10px; border-radius: 6px; overflow-x: auto; }
      .keys { display: flex; gap: 12px; flex-wrap: wrap; }
      .keys figure { margin: 0; text-align: center; }
      .keys img { width: 98px; height: 98px; border-radius: 12px; display: block; }
      .keys figcaption { font-size: 11px; color: #868b91; margin-top: 4px; }
    </style>
  </head>
  <body>
    <h1 style="font-size: 17px">MatUlanzi.HomeAssistant self-test</h1>
    <div id="results"></div>
    <h2>Gerenderte Tasten</h2>
    <div class="keys" id="keys"></div>

    <script>
      // --- fixtures: three ceiling lights all called "Deckenlicht" ----------
      const FIXTURE_STATES = HA_FIXTURES.states;

      const FIXTURE_REGISTRY = HA_FIXTURES.registry;

      // Stand-in for HaClient: only what HaRegistry actually touches.
      const fakeClient = {
        states: new Map(FIXTURE_STATES.map((s) => [s.entity_id, s])),
        getState(id) {
          return this.states.get(id) || null;
        },
        command(msg) {
          const data = FIXTURE_REGISTRY[msg.type];
          return data ? Promise.resolve(data) : Promise.reject(new Error('unsupported: ' + msg.type));
        },
        subscribeEvents() {
          return Promise.resolve(() => {});
        }
      };

      // --- assertions -------------------------------------------------------
      const out = document.getElementById('results');
      let failures = 0;

      function check(label, condition, detail) {
        const line = document.createElement('div');
        line.className = condition ? 'pass' : 'fail';
        line.textContent = (condition ? '✓ ' : '✗ ') + label + (detail ? '  →  ' + detail : '');
        out.appendChild(line);
        if (!condition) failures++;
        return condition;
      }

      function section(title) {
        const h = document.createElement('h2');
        h.textContent = title;
        out.appendChild(h);
      }

      (async function run() {
        const registry = new HaRegistry(fakeClient, { log: console.log });
        await registry.load();

        section('Registry-Join');
        const wz = registry.get('light.decke_wz');
        check('Raum kommt über das Gerät', wz && wz.areaName === 'Wohnzimmer', wz && wz.areaName);
        check('Etage kommt über den Raum', wz && wz.floorName === 'Erdgeschoss', wz && wz.floorName);
        check(
          'name_by_user schlägt name',
          registry.get('light.decke_kueche').deviceName === 'Küchenlampe',
          registry.get('light.decke_kueche').deviceName
        );
        check('Raum direkt an der Entity', registry.get('light.decke_bad').areaName === 'Badezimmer');
        check('Entity ohne Raum bleibt leer', registry.get('lock.haustuer').areaName === '');
        const areaLabels = registry.areas().map((a) => (a.floor ? a.floor + ' › ' : '') + a.name);
        check(
          'Räume nach Etage, dann Name sortiert',
          areaLabels.join(' | ') ===
            'Erdgeschoss › Küche | Erdgeschoss › Wohnzimmer | Obergeschoss › Badezimmer | Flur',
          areaLabels.join(' | ')
        );
        check('Räume ohne Etage stehen hinten', registry.areas()[3].name === 'Flur');

        section('Das eigentliche Problem: 3x "Deckenlicht"');
        const all = registry.search('deckenlicht');
        check('alle drei gefunden', all.length === 3, all.length + ' Treffer');
        check(
          'jeder Treffer hat einen Raum',
          all.every((r) => r.areaName),
          all.map((r) => r.areaName + '/' + r.entityId).join(' | ')
        );

        const kitchen = registry.search('deckenlicht küche');
        check('Raum als Suchwort filtert', kitchen.length === 1 && kitchen[0].entityId === 'light.decke_kueche', kitchen.map((r) => r.entityId).join(','));
        check(
          'Umlaut-Fallback: "kueche" findet "Küche"',
          registry.search('kueche licht').some((r) => r.entityId === 'light.decke_kueche')
        );
        check(
          'Gerätename ist suchbar',
          registry.search('shelly').length === 0 && registry.search('hue').some((r) => r.entityId === 'light.decke_wz'),
          'hue → ' + registry.search('hue').map((r) => r.entityId).join(',')
        );
        check(
          'Etage ist suchbar',
          registry.search('obergeschoss').some((r) => r.entityId === 'light.decke_bad')
        );
        check(
          'Domain-Synonym "licht" filtert auf light',
          registry.search('licht wohnzimmer').every((r) => r.domain === 'light'),
          registry.search('licht wohnzimmer').map((r) => r.entityId).join(',')
        );
        check(
          'Diagnose-Entities sind ausgeblendet',
          !registry.search('akku').length && registry.search('akku', { includeHidden: true }).length === 1
        );
        check('unpassende Suche liefert nichts', registry.search('xyzq').length === 0);
        check(
          'Domain-Filter greift',
          registry.search('', { domains: ['cover'] }).map((r) => r.entityId).join(',') === 'cover.wz_rollo'
        );
        check(
          'Raumfilter greift',
          registry.search('', { areaId: 'bad' }).map((r) => r.entityId).join(',') === 'light.decke_bad'
        );

        section('Domain-Semantik');
        const D = HaDomains;
        const i18n = new I18n('de_DE');
        const t = (k) => i18n.t(k);
        check('Licht an + Helligkeit → Prozent', D.valueText('light.decke_wz', fakeClient.getState('light.decke_wz'), t) === '71%', D.valueText('light.decke_wz', fakeClient.getState('light.decke_wz'), t));
        check('Licht aus → "Aus"', D.valueText('light.decke_kueche', fakeClient.getState('light.decke_kueche'), t) === 'Aus');
        check('Sensor mit Einheit', D.valueText('sensor.aussen_temp', fakeClient.getState('sensor.aussen_temp'), t) === '21.4°C', D.valueText('sensor.aussen_temp', fakeClient.getState('sensor.aussen_temp'), t));
        check('Rollo → Position', D.valueText('cover.wz_rollo', fakeClient.getState('cover.wz_rollo'), t) === '65%');
        check('Rollo offen gilt als aktiv', D.isActive('cover.wz_rollo', fakeClient.getState('cover.wz_rollo')) === true);
        check('verriegeltes Schloss gilt nicht als aktiv', D.isActive('lock.haustuer', fakeClient.getState('lock.haustuer')) === false);
        check('unavailable erkannt', D.isUnavailable(fakeClient.getState('switch.kaffee')) === true);
        check('Licht nutzt eigene Farbe', D.accentColor('light.decke_wz', fakeClient.getState('light.decke_wz')) === 'rgb(255,196,120)');
        check('Schloss-Druck entriegelt', D.pressService('lock.haustuer', fakeClient.getState('lock.haustuer')).service === 'unlock');
        check('Szene startet', D.pressService('scene.abend', null).service === 'turn_on');
        check('Fallback ist homeassistant.toggle', D.pressService('input_boolean.x', null).domain === 'homeassistant');
        check('Helligkeitsbalken 0..1', Math.abs(D.progressOf('light.decke_wz', fakeClient.getState('light.decke_wz')) - 180 / 255) < 0.001);

        section('Steuerfenster: auf und wieder zu');
        const gesendet = [];
        const fensterUd = {
          uuid: 'uuid.test',
          address: '127.0.0.1',
          port: 1,
          language: 'de_DE',
          openView: function (url, w, h, x, y, param) { gesendet.push({ was: 'openView', w: w, h: h, x: x, y: y, param: param }); },
          sendToPropertyInspector: function (payload, ctx) { gesendet.push({ was: payload.response, an: ctx }); }
        };
        let uhr = 1000;
        const fenster = new ControlWindow({
          ud: fensterUd,
          location: { href: 'file:///plugins/ha/plugin/service.html' },
          now: () => uhr,
          senderUuid: 'uuid.control',
          width: 420,
          height: 520,
          screen: { availWidth: 1920, availHeight: 1040 }
        });

        // 1920x1040, Fenster 420x520, Rahmenschätzung 31 px hoch.
        check('das Fenster landet waagerecht in der Mitte', fenster.centre().x === 750, JSON.stringify(fenster.centre()));
        check('und senkrecht, um den geschätzten Rahmen versetzt', fenster.centre().y === 245, JSON.stringify(fenster.centre()));

        // A screen that says nothing must not push the window to 0,0.
        const blind = new ControlWindow({ ud: fensterUd, location: { href: 'file:///x/plugin/s.html' }, screen: {} });
        check('ohne Bildschirmmaße bleibt ein brauchbarer Platz', blind.centre().x === 80 && blind.centre().y === 80);

        // Zero would be dropped by the SDK, which then centres by its own rules.
        const riesig = new ControlWindow({ ud: fensterUd, location: { href: 'file:///x/plugin/s.html' }, width: 4000, height: 4000, screen: { availWidth: 800, availHeight: 600 } });
        check('ein zu großes Fenster rutscht nicht auf Null', riesig.centre().x === 1 && riesig.centre().y === 1);

        check('geschlossen bleibt geschlossen', fenster.close() === false);
        check('erstes Halten öffnet', fenster.toggle({ entityId: 'climate.wz' }) === 'opened');
        check('openView wurde gerufen', gesendet.length === 1 && gesendet[0].was === 'openView');
        check('openView bekam die Mitte mitgeteilt', gesendet[0].x === 750 && gesendet[0].y === 245, JSON.stringify(gesendet[0]));

        gesendet.length = 0;
        fenster.open({ entityId: 'light.y', x: 12, y: 34 });
        check('ein eigener Platz schlägt die Mitte', gesendet[0].x === 12 && gesendet[0].y === 34);
        fenster.noteClosed();

        // The window reports in, as the real page does on every heartbeat -
        // including the size it really came out at: 31 px of title bar.
        fenster.noteAlive('ctx-1', 'climate.wz', [420, 551]);
        check('der gemessene Rahmen ersetzt die Schätzung', fenster.frame.x === 0 && fenster.frame.y === 31, JSON.stringify(fenster.frame));
        check('die Mitte rutscht um den halben Rahmen hoch', fenster.centre().y === 245, JSON.stringify(fenster.centre()));
        check('ein Host ohne Rahmen wird auch gelernt', (function () {
          fenster.noteFrame([420, 520]);
          const y = fenster.centre().y;
          fenster.noteFrame([420, 551]);
          return y === 260;
        })());
        check('waagerecht bleibt es, wo es war', fenster.centre().x === 750);
        check('Unsinn vom Fenster ändert nichts', (function () { fenster.noteFrame(['x', null]); return fenster.frame.y === 31; })());
        check('zweites Halten schließt wieder', fenster.toggle({ entityId: 'climate.wz' }) === 'closed');
        check('die Seite bekommt den Schließbefehl', gesendet[gesendet.length - 1].was === 'control:close');
        check('danach ist nichts mehr offen', fenster.isAlive() === false && fenster.showing === '');

        gesendet.length = 0;
        fenster.toggle({ entityId: 'climate.wz' });
        fenster.noteAlive('ctx-2', 'climate.wz');
        check('ein anderes Gerät schließt nicht, sondern wechselt', fenster.toggle({ entityId: 'cover.wz' }) === 'switched');
        check('das Fenster zeigt nun das andere Gerät', fenster.showing === 'cover.wz');
        check('ein Halten auf dem neuen Gerät schließt', fenster.toggle({ entityId: 'cover.wz' }) === 'closed');

        // A window nobody has heard from in a while is gone, whatever it said last.
        fenster.toggle({ entityId: 'light.x' });
        fenster.noteAlive('ctx-3', 'light.x');
        uhr += 60000;
        check('ein verstummtes Fenster gilt als zu', fenster.toggle({ entityId: 'light.x' }) === 'opened');

        section('Was ein Gerät wirklich kann');
        const C = HaCapabilities;
        // A SONOFF relay flashed as a light: one colour mode, and it is onoff.
        const sonoff = { state: 'on', attributes: { supported_color_modes: ['onoff'], supported_features: 0 } };
        const dimmbar = { state: 'on', attributes: { supported_color_modes: ['brightness'], supported_features: 0 } };
        const farbig = { state: 'on', attributes: { supported_color_modes: ['color_temp', 'hs'], supported_features: 0 } };
        check('Relais-Licht kann an/aus', C.can('light.decke', sonoff, 'on_off') === true);
        check('Relais-Licht hat keine Helligkeit', C.can('light.decke', sonoff, 'brightness') === false);
        check('Relais-Licht hat keine Farbe', C.can('light.decke', sonoff, 'colour') === false);
        check('Dimmer hat Helligkeit, aber keine Farbe', C.can('light.x', dimmbar, 'brightness') === true && C.can('light.x', dimmbar, 'colour') === false);
        check('Farblampe hat Farbe und Farbtemperatur', C.can('light.x', farbig, 'colour') === true && C.can('light.x', farbig, 'kelvin') === true);
        check('ohne Angabe wird nichts versteckt', C.can('light.x', { state: 'on', attributes: {} }, 'brightness') === true);
        check('ohne Bitmaske gilt jede Fähigkeit als vorhanden', C.hasNamedFeature('light', { state: 'on', attributes: {} }, 'light.LightEntityFeature.TRANSITION') === true);
        check('Bitmaske 0 heißt: kann es nicht', C.hasNamedFeature('light', sonoff, 'light.LightEntityFeature.TRANSITION') === false);
        // Older Home Assistant installations send the bare number instead.
        check('die nackte Zahl meint dasselbe Bit', C.hasNamedFeature('light', sonoff, 32) === false);
        check('gesetztes Bit als Zahl erkannt', C.hasNamedFeature('light', { state: 'on', attributes: { supported_features: 32 } }, 32) === true);

        const rollo = { state: 'open', attributes: { supported_features: 15, current_position: 40 } };
        const einfachesRollo = { state: 'open', attributes: { supported_features: 3 } };
        check('Rollo hat kein AN/AUS', C.can('cover.wz', rollo, 'on_off') === false);
        check('Rollo fährt auf und zu', C.can('cover.wz', rollo, 'open_close') === true);
        check('Rollo mit Positionsbit kann Position', C.can('cover.wz', rollo, 'position') === true);
        check('Rollo ohne Positionsbit kann keine Position', C.can('cover.wz', einfachesRollo, 'position') === false);
        check('Rollo ohne Stopbit hat kein Stop', C.can('cover.wz', einfachesRollo, 'stop') === false);

        const klima = { state: 'heat', attributes: { supported_features: 1 + 8 + 16, hvac_modes: ['off', 'heat'], fan_modes: ['low', 'high'], preset_modes: ['eco'] } };
        check('Klima kann Solltemperatur', C.can('climate.wz', klima, 'temperature') === true);
        check('Klima kann Lüfterstufen', C.can('climate.wz', klima, 'fan_mode') === true);
        check('Klima ohne Swing-Bit zeigt kein Swing', C.can('climate.wz', klima, 'swing_mode') === false);
        check('ein einziges Preset ist keine Auswahl', C.can('climate.wz', klima, 'preset_mode') === false);
        check('Klima ohne Ein/Aus-Bit hat kein AN/AUS', C.can('climate.wz', klima, 'on_off') === false);

        const box = { state: 'playing', attributes: { supported_features: 4 + 16384, volume_level: 0.3 } };
        check('Box kann Lautstärke', C.can('media_player.box', box, 'volume') === true);
        check('Box ohne Titel-Bits zeigt keine Titelsprünge', C.can('media_player.box', box, 'track') === false);
        check('unbekannte Fähigkeit ist nein', C.can('light.x', farbig, 'quatsch') === false);

        section('Dienste, die zur Entität passen');
        const katalog = {
          light: {
            turn_on: {
              name: 'Einschalten',
              fields: {
                brightness_pct: { selector: { number: { min: 0, max: 100, unit_of_measurement: '%' } }, filter: { attribute: { supported_color_modes: ['light.ColorMode.BRIGHTNESS', 'light.ColorMode.HS'] } } },
                rgb_color: { selector: { color_rgb: null }, filter: { attribute: { supported_color_modes: ['light.ColorMode.HS', 'light.ColorMode.RGB'] } } },
                transition: { selector: { number: { min: 0, max: 30 } }, filter: { supported_features: ['light.LightEntityFeature.TRANSITION'] } },
                effect: { selector: { text: null }, filter: { supported_features: [4] } }
              }
            },
            turn_off: { name: 'Ausschalten', fields: {} }
          },
          cover: {
            open_cover: { fields: {} },
            close_cover: { fields: {} },
            stop_cover: { fields: {} },
            stop_cover_tilt: { fields: {} },
            set_cover_tilt_position: { fields: {} },
            set_cover_position: { fields: { position: { selector: { number: { min: 0, max: 100, unit_of_measurement: '%' } } } } }
          }
        };
        const felderVon = (entity, state) => {
          const dienst = HaServices.find(katalog, 'light', 'turn_on', state);
          return dienst.fields.map((f) => f.key).join(',');
        };
        check('Relais-Licht ohne Zusatzbits bekommt gar kein Feld', felderVon('light.decke', sonoff) === '', felderVon('light.decke', sonoff));
        check('Dimmer bekommt die Helligkeit', felderVon('light.x', dimmbar) === 'brightness_pct', felderVon('light.x', dimmbar));
        check('Farblampe bekommt Helligkeit und Farbe', felderVon('light.x', farbig) === 'brightness_pct,rgb_color', felderVon('light.x', farbig));
        check('ohne Zustand bleibt alles stehen', felderVon('light.x', null) === 'brightness_pct,rgb_color,transition,effect');

        const mitUeberblendung = { state: 'on', attributes: { supported_color_modes: ['hs'], supported_features: 32 } };
        check('Lampe mit Überblendungsbit bekommt das Feld', felderVon('light.x', mitUeberblendung) === 'brightness_pct,rgb_color,transition', felderVon('light.x', mitUeberblendung));
        check('unbekannte Fähigkeitsnamen verstecken nichts', HaCapabilities.hasNamedFeature('light', mitUeberblendung, 'light.LightEntityFeature.WASAUCHIMMER') === true);

        const dienstIds = (entity, state) =>
          HaServices.servicesFor(katalog, entity, state)
            .filter((d) => d.domain === 'cover')
            .map((d) => d.service)
            .join(',');
        check('einfaches Rollo verliert Position und Stop', dienstIds('cover.wz', einfachesRollo) === 'close_cover,open_cover', dienstIds('cover.wz', einfachesRollo));
        check('ein Rollo ohne Lamellen zeigt keine Lamellendienste', dienstIds('cover.wz', rollo) === 'close_cover,open_cover,set_cover_position,stop_cover', dienstIds('cover.wz', rollo));

        // Bits 16 and 64: slats it can tip and stop, but not aim at an angle.
        const lamellen = { state: 'open', attributes: { supported_features: 15 + 16 + 64 } };
        check('kippbare Lamellen bringen ihre Dienste mit', dienstIds('cover.wz', lamellen) === 'close_cover,open_cover,set_cover_position,stop_cover,stop_cover_tilt', dienstIds('cover.wz', lamellen));
        check('ohne Winkelbit kein Winkelregler', HaCapabilities.can('cover.wz', lamellen, 'tilt') === false);
        check('kippen kann es trotzdem', HaCapabilities.can('cover.wz', lamellen, 'tilt_move') === true);
        check('Enum-Ende wird gelesen', HaServices.enumTail('light.ColorMode.COLOR_TEMP') === 'color_temp');

        section('Bibliothek: Verbindungen & Buttons');
        const emptyLib = new Library({});
        check('leere Bibliothek', !emptyLib.connections.length && !emptyLib.buttons.length);

        const migrated = Library.parse({ ha_url: 'http://ha.local:8123', ha_token: 'tok' });
        check(
          'alte Flach-Einstellungen werden migriert',
          migrated.connections.length === 1 && migrated.connections[0].url === 'http://ha.local:8123',
          JSON.stringify(migrated.connections[0] || {})
        );

        const lib = new Library({});
        const conn = lib.addConnection({ name: 'Zuhause', url: 'http://ha.local:8123', token: 'tok' });
        const other = lib.addConnection({ name: 'Büro', url: 'http://office:8123', token: 'tok2' });
        const btn = lib.addButton({ name: 'Deckenlicht', entity_id: 'light.decke_wz' });
        check('neuer Button erbt die erste Verbindung', btn.connection === conn.id);
        check('Verbindung per id gefunden', lib.connection(other.id).name === 'Büro');
        check('ohne id kommt die erste Verbindung', lib.connection('').id === conn.id);

        const resolved = lib.resolveKey({ button: btn.id });
        check('Taste löst auf Button auf', resolved && resolved.entityId === 'light.decke_wz');
        check('Stil ist vollständig', resolved.style.center === '{{value}}');
        check('Verbindung wird mitgegeben', resolved.connection === conn.id);

        lib.updateButton(btn.id, { style: { top: '', bg_off: '#123456' } });
        const styled = lib.resolveKey({ button: btn.id });
        check('leere Textzone bleibt leer', styled.style.top === '', JSON.stringify(styled.style.top));
        check('eigene Farbe bleibt', styled.style.bg_off === '#123456');

        const overridden = lib.resolveKey({ button: btn.id, label: 'Sofa', bg_off: '#ff0000' });
        check('Taste überschreibt Beschriftung', overridden.label === 'Sofa');
        check('Taste überschreibt Farbe', overridden.style.bg_off === '#ff0000');
        check(
          'leerer Override erbt',
          lib.resolveKey({ button: btn.id, bg_off: '' }).style.bg_off === '#123456'
        );

        check('unbekannte Referenz ergibt null', lib.resolveKey({ button: 'gibtsnicht' }) === null);
        check('leere Einstellungen ergeben null', lib.resolveKey({}) === null);
        check(
          'Altbestand ohne Button funktioniert weiter',
          (lib.resolveKey({ entity_id: 'light.x' }) || {}).source === 'inline'
        );

        const copy = lib.duplicateButton(btn.id);
        check('Duplikat hat eigene id', copy.id !== btn.id && lib.buttons.length === 2);

        // Pixelprobe über das fertige Bild statt über den Renderer-Zustand:

        async function pixelAus(datenUrl, x, y) {
          const bild = new Image();
          await new Promise((fertig, schief) => {
            bild.onload = fertig;
            bild.onerror = schief;
            bild.src = datenUrl;
          });
          const flaeche = document.createElement('canvas');
          flaeche.width = bild.width;
          flaeche.height = bild.height;
          const ctx = flaeche.getContext('2d');
          ctx.drawImage(bild, 0, 0);
          return ctx.getImageData(x, y, 1, 1).data;
        }

          const lampe = (id, state, attrs) => ({ entityId: id, state: state, attributes: attrs || {} });

          const regeln = [
            { id: 'r1', scope: 'any', what: 'attr:battery_level', op: '<', value: 20, icon: 'mdi:battery-alert', bg: '#e24b4a' },
            { id: 'r2', scope: 'any', what: 'state', op: '=', value: 'on', icon: 'mdi:lightbulb', bg: '#f4b740' },
            { id: 'r3', scope: 'all', what: 'state', op: '=', value: 'off', icon: 'mdi:lightbulb-outline', bg: '#2a2d33' }
          ];

          check('erste zutreffende Regel gewinnt', dr.evaluate(regeln, [lampe('light.a', 'on', { battery_level: 8 })]).id === 'r1');
          check('sonst greift die nächste', dr.evaluate(regeln, [lampe('light.a', 'on')]).id === 'r2');
          check('und die letzte', dr.evaluate(regeln, [lampe('light.a', 'off')]).id === 'r3');
          check('ohne Treffer bleibt der eigene Stil', dr.evaluate(regeln, [lampe('light.a', 'unavailable')]) === null);
          check('ohne Regeln erst recht', dr.evaluate([], [lampe('light.a', 'on')]) === null);
          check('ohne Entitäten trifft nichts', dr.evaluate(regeln, []) === null);

          check(
            '"irgendeine" reicht eine',
            dr.matches(regeln[1], [lampe('light.a', 'off'), lampe('light.b', 'on')]) === true
          );
          check(
            '"alle" verlangt alle',
            dr.matches(regeln[2], [lampe('light.a', 'off'), lampe('light.b', 'on')]) === false
          );
          check(
            '"alle" trifft, wenn wirklich alle',
            dr.matches(regeln[2], [lampe('light.a', 'off'), lampe('light.b', 'off')]) === true
          );
          check(
            'eine bestimmte Entität',
            dr.matches({ scope: 'light.b', what: 'state', op: '=', value: 'on' }, [lampe('light.a', 'off'), lampe('light.b', 'on')]) === true
          );
          check(
            'eine nicht vorhandene Entität trifft nie',
            dr.matches({ scope: 'light.z', what: 'state', op: '=', value: 'on' }, [lampe('light.a', 'on')]) === false
          );

          check('Zahlen vergleichen numerisch', dr.compare('9', '<', 20) === true);
          check('und nicht als Text', dr.compare('9', '<', '100') === true);
          check('Text vergleicht als Text', dr.compare('heat', '=', 'heat') === true);
          check('ungleich funktioniert', dr.compare('heat', '!=', 'cool') === true);
          check('Groß- und Kleinschreibung egal', dr.compare('Heat', '=', 'heat') === true);
          check('unerreichbar wird erkannt', dr.compare('unavailable', 'unavailable') === true);
          check('ein fehlender Wert trifft nicht', dr.compare(undefined, '=', 'on') === false);

          check('Attribut wird gelesen', dr.valueOf(lampe('l', 'on', { brightness: 128 }), 'attr:brightness') === 128);
          check('Zustand wird gelesen', dr.valueOf(lampe('l', 'on'), 'state') === 'on');

          const stil = dr.applyTo({ icon_on: 'a', icon_off: 'b', radius: 28 }, { icon: 'mdi:fire', bg: '#f00' });
          check('Regel setzt beide Richtungen', stil.icon_on === 'mdi:fire' && stil.icon_off === 'mdi:fire');
          check('und die Hintergrundfarbe', stil.bg_on === '#f00' && stil.bg_off === '#f00');
          check('lässt Unerwähntes in Ruhe', stil.radius === 28);
          check('ohne Treffer bleibt der Stil unangetastet', dr.applyTo({ radius: 10 }, null).radius === 10);

          check('Vorschlag für Licht', dr.suggest('light.x').length === 2);
          check('Vorschlag für Klima kennt heizen', dr.suggest('climate.x').some((r) => r.icon === 'mdi:fire'));
          check('Vorschlag für Rollo zeichnet den Stand', dr.suggest('cover.x').some((r) => r.icon === 'widget:shutter'));
          check('unbekannte Domain schlägt nichts vor', dr.suggest('sensor.x').length === 0);
        }

        section('Dienste kommen aus Home Assistant selbst');
        {
          const hs = HaServices;
          const katalog = {
            cover: {
              set_cover_position: {
                name: 'Set position',
                fields: {
                  position: { required: true, selector: { number: { min: 0, max: 100, step: 1, unit_of_measurement: '%' } } },
                  speed: { selector: { state: { attribute: 'speed' } } }
                }
              },
              open_cover: { fields: {} },
              stop_cover: { fields: {} }
            },
            light: {
              turn_on: {
                fields: {
                  rgb_color: { selector: { color_rgb: null } },
                  color_temp_kelvin: { selector: { color_temp: { unit: 'kelvin', min: 2000, max: 6500 } } },
                  brightness_pct: { selector: { number: { min: 0, max: 100, unit_of_measurement: '%' } } },
                  effect: { selector: { text: null } },
                  advanced_blob: { selector: { object: {} } }
                }
              }
            },
            homeassistant: { turn_on: { fields: {} }, turn_off: { fields: {} }, toggle: { fields: {} } }
          };

          const rollo = hs.servicesFor(katalog, 'cover.buro');
          check('eigene Domain kommt zuerst', rollo[0].domain === 'cover');
          check('alle Rollo-Dienste dabei', rollo.filter((d) => d.domain === 'cover').length === 3);
          check('generisch Ein/Aus wird mit angeboten', rollo.some((d) => d.domain === 'homeassistant' && d.service === 'turn_on'));
          katalog.homeassistant.restart = { fields: {} };
          katalog.homeassistant.stop = { fields: {} };
          const nochmal = hs.servicesFor(katalog, 'cover.buro').filter((d) => d.domain === 'homeassistant').map((d) => d.service);
          check('HA neu starten wird NICHT angeboten', nochmal.indexOf('restart') === -1, nochmal.join(','));
          check('HA anhalten wird NICHT angeboten', nochmal.indexOf('stop') === -1);
          check('Schalten bleibt', nochmal.indexOf('turn_on') !== -1);

          const position = hs.find(katalog, 'cover', 'set_cover_position');
          const feld = position.fields.filter((f) => f.key === 'position')[0];
          check('Prozentfeld erkannt', feld.type === 'percent' && feld.min === 0 && feld.max === 100, JSON.stringify(feld));
          check('Pflichtfeld erkannt', feld.required === true);

          const licht = hs.find(katalog, 'light', 'turn_on');
          const arten = {};
          licht.fields.forEach((f) => { arten[f.key] = f.type; });
          check('Farbe wird zum Farbwähler', arten.rgb_color === 'color');
          check('Farbtemperatur wird zum Kelvin-Regler', arten.color_temp_kelvin === 'kelvin');
          check('Helligkeit wird zum Prozentregler', arten.brightness_pct === 'percent');
          check('freier Text bleibt Text', arten.effect === 'text');
          check('unrenderbares Feld fällt raus', arten.advanced_blob === undefined);
          check('und wird als unvollständig vermerkt', licht.partial === true);
          check('ein vollständiger Dienst nicht', position.partial === false);

          check('step "any" wird zu 1', hs.normalizeField('x', { selector: { number: { step: 'any' } } }).step === 1);
          check('Auswahl wird zur Liste', JSON.stringify(hs.normalizeField('m', { selector: { select: { options: ['a', 'b'] } } }).options) === '["a","b"]');
          check('Objekt-Auswahl liefert Werte', JSON.stringify(hs.normalizeField('m', { selector: { select: { options: [{ value: 'a', label: 'A' }] } } }).options) === '["a"]');
          check('Ja/Nein erkannt', hs.normalizeField('b', { selector: { boolean: null } }).type === 'boolean');
          check('Beschriftung aus dem Schlüssel', hs.normalizeField('color_temp_kelvin', {}).label === 'Color temp kelvin');
          check('HA-Name schlägt den Schlüssel', hs.normalizeField('x', { name: 'Fancy' }).label === 'Fancy');

          check('Daten: Farbe wird zu RGB', JSON.stringify(hs.buildData(licht.fields, { rgb_color: '#ffa03c' }).rgb_color) === '[255,160,60]');
          check('Daten: leeres Feld fehlt', hs.buildData(licht.fields, { brightness_pct: '' }).brightness_pct === undefined);
          check('Daten: Zahl bleibt Zahl', hs.buildData(licht.fields, { brightness_pct: '40' }).brightness_pct === 40);
          check('Werte zurücklesen: Farbe als Hex', hs.readValues(licht.fields, { rgb_color: [255, 160, 60] }).rgb_color === '#ffa03c');
        }

        section('Rollo zum Ziehen: die Geometrie');
        {
          const cc = CoverControl;
          // Fensterkasten: oben bei 100, 200 hoch.
          const oben = 100, hoch = 200;

          check('ganz oben gezogen heißt offen', cc.positionFromY(100, oben, hoch) === 100);
          check('ganz unten gezogen heißt zu', cc.positionFromY(300, oben, hoch) === 0);
          check('Mitte ist halb', cc.positionFromY(200, oben, hoch) === 50);
          check('ein Viertel von oben lässt 75 offen', cc.positionFromY(150, oben, hoch) === 75);
          check('über den Rand hinaus wird gekappt', cc.positionFromY(0, oben, hoch) === 100);
          check('unter den Rand hinaus ebenso', cc.positionFromY(999, oben, hoch) === 0);
          check('ein Kasten ohne Höhe stürzt nicht ab', cc.positionFromY(50, 0, 0) === 0);

          check('offen verdeckt nichts', cc.coveredPercent(100) === 0);
          check('zu verdeckt alles', cc.coveredPercent(0) === 100);
          check('75 offen verdeckt ein Viertel', cc.coveredPercent(75) === 25);
          check('Unsinn wird zu 0', cc.coveredPercent('abc') === 0);
          check('zu große Werte werden gekappt', cc.coveredPercent(-40) === 100);

          // Hin und zurück: was man zieht, wird auch gezeigt.
          for (const wunsch of [0, 17, 50, 83, 100]) {
            const y = oben + hoch * (1 - wunsch / 100);
            check('gezogen auf ' + wunsch + ' ergibt ' + wunsch, cc.positionFromY(y, oben, hoch) === wunsch);
          }
        }

        section('Farbregler: die Mathematik dahinter');
        {
          const cc = ColorControls;

          check('2000 K ist warm (rot vor blau)', cc.kelvinToRgb(2000)[0] > cc.kelvinToRgb(2000)[2] + 100, JSON.stringify(cc.kelvinToRgb(2000)));
          check('6500 K ist kühl (blau holt auf)', cc.kelvinToRgb(6500)[2] > cc.kelvinToRgb(2700)[2] + 60);
          check('Rot bleibt in Grenzen', cc.kelvinToRgb(40000).every((v) => v >= 0 && v <= 255));
          check('absurd kalte Werte kippen nicht', cc.kelvinToRgb(-5).every((v) => v >= 0 && v <= 255));

          check('reines Rot aus HSV', JSON.stringify(cc.hsvToRgb(0, 100, 100)) === '[255,0,0]');
          check('reines Grün aus HSV', JSON.stringify(cc.hsvToRgb(120, 100, 100)) === '[0,255,0]');
          check('reines Blau aus HSV', JSON.stringify(cc.hsvToRgb(240, 100, 100)) === '[0,0,255]');
          check('ohne Sättigung wird es grau', JSON.stringify(cc.hsvToRgb(200, 0, 50)) === '[128,128,128]', JSON.stringify(cc.hsvToRgb(200, 0, 50)));
          check('ohne Helligkeit wird es schwarz', JSON.stringify(cc.hsvToRgb(200, 100, 0)) === '[0,0,0]');
          check('Hue über 360 läuft rund', JSON.stringify(cc.hsvToRgb(480, 100, 100)) === JSON.stringify(cc.hsvToRgb(120, 100, 100)));

          check('RGB zurück nach HSV', JSON.stringify(cc.rgbToHsv([255, 0, 0])) === '[0,100,100]');
          check('Grau hat keine Sättigung', cc.rgbToHsv([128, 128, 128])[1] === 0);
          const rund = cc.hsvToRgb.apply(null, cc.rgbToHsv([200, 120, 40]));
          check('Hin und zurück bleibt nah dran', Math.abs(rund[0] - 200) <= 2 && Math.abs(rund[1] - 120) <= 2 && Math.abs(rund[2] - 40) <= 2, JSON.stringify(rund));

          const verlauf = cc.kelvinGradient(2000, 6500, 4);
          check('Farbverlauf hat Stützstellen', (verlauf.match(/rgb\(/g) || []).length === 5, verlauf.slice(0, 40));
          check('Helligkeitsverlauf beginnt schwarz', cc.brightnessGradient([255, 0, 0]).indexOf('#000 0%') !== -1);
          check('Vorschlagsfarben vorhanden', cc.swatches.length >= 5 && cc.swatches[0].rgb.length === 3);
        }

        section('Standard-Aktionen statt JSON tippen');
        {
          const ap = ActionPresets;

          const fuerLicht = ap.forEntity('light.wz').map((p) => p.id);
          check('Licht bekommt Licht-Aktionen', fuerLicht.indexOf('light_on') !== -1);
          check('und keine Klima-Aktion', fuerLicht.indexOf('climate_temperature') === -1);
          check('allgemeine Aktion kommt zuletzt', fuerLicht[fuerLicht.length - 1] === 'notify');
          check('Klima bekommt Temperatur und Betriebsart', ap.forEntity('climate.x').map((p) => p.id).indexOf('climate_mode') !== -1);
          check('Rollo bekommt Position', ap.forEntity('cover.x').map((p) => p.id)[0] === 'cover_position');

          const licht = ap.byId('light_on');
          const daten = ap.buildData(licht, { brightness_pct: '60', rgb_color: '#ffa03c', transition: '' });
          check('Helligkeit wird zur Zahl', daten.brightness_pct === 60, JSON.stringify(daten));
          check('Farbe wird zu RGB', JSON.stringify(daten.rgb_color) === '[255,160,60]', JSON.stringify(daten.rgb_color));
          check('leeres Feld fehlt ganz', !('transition' in daten));

          const volume = ap.buildData(ap.byId('media_volume'), { volume_level: '40' });
          check('Lautstärke wird zum Bruch (HA will 0..1)', volume.volume_level === 0.4, JSON.stringify(volume));

          const modus = ap.buildData(ap.byId('climate_mode'), { hvac_mode: 'cool' });
          check('Betriebsart bleibt Text', modus.hvac_mode === 'cool');

          const zurueck = ap.readValues(licht, { brightness_pct: 60, rgb_color: [255, 160, 60] });
          check('Helligkeit kommt zurück', zurueck.brightness_pct === 60);
          check('Farbe kommt als Hex zurück', zurueck.rgb_color === '#ffa03c', String(zurueck.rgb_color));
          check('Lautstärke kommt als Prozent zurück', ap.readValues(ap.byId('media_volume'), { volume_level: 0.4 }).volume_level === 40);

          check('gespeicherter Aufruf findet seine Aktion', ap.match('climate', 'set_temperature').id === 'climate_temperature');
          check('unbekannter Aufruf findet keine', ap.match('foo', 'bar') === null);

          check('Farbe rund: hex zu rgb', JSON.stringify(ap.hexToRgb('#00ff80')) === '[0,255,128]');
          check('Farbe rund: rgb zu hex', ap.rgbToHex([0, 255, 128]) === '#00ff80');
          check('kaputte Farbe ergibt nichts', ap.hexToRgb('grün') === null);
          check('einstellige Anteile werden aufgefüllt', ap.rgbToHex([1, 2, 3]) === '#010203');
        }

        section('EIN mit Farbe: was genau gesendet wird');
        {
          const sp = SwitchPlan;

          check('ohne Daten kein eigener Plan', sp.switchPlan('light.x', true, '') === null);
          check('leerer Text zählt als ohne', sp.switchPlan('light.x', true, '   ') === null);

          const an = sp.switchPlan('light.wz', true, '{"brightness_pct":60,"rgbw_color":[255,160,60,0]}');
          check('Licht EIN wird zu light.turn_on', an.domain === 'light' && an.service === 'turn_on', JSON.stringify(an));
          check('Farbe und Helligkeit reisen mit', an.data.brightness_pct === 60 && an.data.rgbw_color[0] === 255);

          const aus = sp.switchPlan('light.wz', false, '{"transition":2}');
          check('Licht AUS wird zu light.turn_off', aus.service === 'turn_off' && aus.data.transition === 2);

          check('Rollo EIN heißt open_cover', sp.switchPlan('cover.b', true, '{"position":50}').service === 'open_cover');
          check('Rollo AUS heißt close_cover', sp.switchPlan('cover.b', false, '{"x":1}').service === 'close_cover');
          check('Schloss EIN heißt lock', sp.switchPlan('lock.t', true, '{"code":"1"}').service === 'lock');
          check('Szene bleibt turn_on', sp.switchPlan('scene.abend', false, '{"transition":1}').service === 'turn_on');
          check('Skript bleibt turn_on', sp.switchPlan('script.gute_nacht', true, '{"variables":{}}').service === 'turn_on');

          check('kaputtes JSON ergibt keinen Plan', sp.switchPlan('light.x', true, '{kaputt') === null);
          check('und wird als Fehler gemeldet', Boolean(sp.parseData('{kaputt').error));
          check('eine Liste ist kein Objekt', Boolean(sp.parseData('[1,2]').error));
          check('gültiges JSON kommt durch', sp.parseData('{"a":1}').data.a === 1);

          const def = {
            onData: '{"brightness_pct":40}',
            offData: '',
            entityActions: { 'light.b': { on: '{"brightness_pct":100}', off: '' } }
          };
          check('eigene Daten der Entität schlagen die Vorgabe', sp.dataFor(def, 'light.b', true) === '{"brightness_pct":100}');
          check('ohne eigene gilt die Vorgabe', sp.dataFor(def, 'light.a', true) === '{"brightness_pct":40}');
          check('leere eigene fällt auf die Vorgabe zurück', sp.dataFor(def, 'light.b', false) === '');

          check('Button mit Daten wird erkannt', sp.hasExtras(def) === true);
          check('Button ohne Daten wird erkannt', sp.hasExtras({ onData: '', offData: '', entityActions: {} }) === false);
          check('leere Eintraege zaehlen nicht', sp.hasExtras({ onData: ' ', offData: '', entityActions: { 'light.a': { on: '', off: '' } } }) === false);
          check('nichts uebergeben ist auch nichts', sp.hasExtras(null) === false);
        }

        section('Relative Schritte (Ersatz für den Drehknopf)');
        {
          const klima = (soll, min, max) => ({
            state: 'cool',
            attributes: { temperature: soll, min_temp: min, max_temp: max, current_temperature: 22 }
          });
          const plan = HaDomains.stepPlan('climate.buero', klima(21, 7, 35), 1);
          check('Klima +1 Grad', plan.service === 'set_temperature' && plan.data.temperature === 22, JSON.stringify(plan && plan.data));
          check('Klima -1 Grad', HaDomains.stepPlan('climate.buero', klima(21, 7, 35), -1).data.temperature === 20);
          check('halbe Grad ohne Fließkomma-Müll', HaDomains.stepPlan('climate.b', klima(21.5, 7, 35), 0.5).data.temperature === 22);
          check('oben begrenzt auf max_temp', HaDomains.stepPlan('climate.b', klima(35, 7, 35), 1).data.temperature === 35);
          check('unten begrenzt auf min_temp', HaDomains.stepPlan('climate.b', klima(7, 7, 35), -1).data.temperature === 7);

          const licht = (b) => ({ state: 'on', attributes: { brightness: b } });
          check('Licht +10 Prozent', HaDomains.stepPlan('light.x', licht(128), 10).data.brightness_pct === 60, JSON.stringify(HaDomains.stepPlan('light.x', licht(128), 10)));
          check('Licht auf 0 schaltet aus', HaDomains.stepPlan('light.x', licht(10), -20).service === 'turn_off');
          check('Licht über 100 wird gekappt', HaDomains.stepPlan('light.x', licht(255), 10).data.brightness_pct === 100);

          check('Rollo bekommt Position', HaDomains.stepPlan('cover.x', { state: 'open', attributes: { current_position: 40 } }, 10).data.position === 50);
          check('Lautstärke rechnet in Prozent', HaDomains.stepPlan('media_player.x', { state: 'playing', attributes: { volume_level: 0.5 } }, 10).data.volume_level === 0.6);
          check('Zahl-Entität mit eigenen Grenzen', HaDomains.stepPlan('number.x', { state: '5', attributes: { min: 0, max: 6 } }, 5).data.value === 6);

          check('Schalter lässt sich nicht verstellen', HaDomains.stepPlan('switch.x', { state: 'on', attributes: {} }, 1) === null);
          check('ohne Zustand kein Plan', HaDomains.stepPlan('climate.x', null, 1) === null);
          check('Schrittweite 0 ergibt nichts', HaDomains.stepPlan('climate.x', klima(21, 7, 35), 0) === null);
          check('unerreichbare Entität ergibt nichts', HaDomains.stepPlan('climate.x', { state: 'unavailable', attributes: {} }, 1) === null);

          check('steppbare Domains erkannt', HaDomains.isSteppable('climate.x') && HaDomains.isSteppable('light.x'));
          check('nicht steppbare erkannt', !HaDomains.isSteppable('switch.x') && !HaDomains.isSteppable('scene.x'));

          const call = HaDomains.pressService('automation.morgens', { state: 'on', attributes: {} });
          check('automation.trigger statt toggle', call.domain === 'automation' && call.service === 'trigger', JSON.stringify(call));
          check('Szene bleibt turn_on', HaDomains.pressService('scene.abend', { state: 'on' }).service === 'turn_on');
          check('Schalter bleibt generisch', HaDomains.pressService('switch.x', { state: 'on' }).domain === 'homeassistant');

        section('Langer Druck führt einen anderen Button aus');
        {
          const lib = Library.parse({
            connections: [{ id: 'c1', name: 'HA', url: 'http://ha:8123', token: 't' }],
            buttons: [
              { id: 'b-licht', name: 'Licht', connection: 'c1', entities: ['light.x'], type: 'toggle' },
              {

              },

          check('mit seinen Daten', ziel.service.data === '{"hvac_mode":"cool"}');

          const ohne = lib.resolveKey({ button: 'b-licht' });
          check('Vorgabe bleibt identifizieren', ohne.longPress === 'identify');
          check('ohne hinterlegten Button', ohne.longPressButton === '');
          check('ein leerer Verweis löst nichts auf', lib.resolveKey({ button: '' }) === null);
        }

        section('Kontext-Ziel (folgt dem zuletzt gewählten Gerät)');
        {
          let jetzt = 1000;
          const ziel = new TargetContext({ ttlMs: 5000, now: () => jetzt });
          let rufe = 0;
          ziel.on(() => rufe++);

          check('anfangs kein Ziel', ziel.get() === null);
          check('leere Entität wird abgelehnt', ziel.set('') === false);
          check('Ziel setzen meldet Erfolg', ziel.set('climate.buero', 'conn-1', 'Büro') === true);
          check('Horcher wurde benachrichtigt', rufe === 1);
          check('Ziel wird geliefert', ziel.get().entityId === 'climate.buero');
          check('Verbindung reist mit', ziel.get().connectionId === 'conn-1');
          check('Name reist mit', ziel.get().name === 'Büro');

          jetzt += 4000;
          check('vor Ablauf noch da', ziel.get() !== null);
          check('Restzeit wird gemeldet', ziel.remaining() === 1000, String(ziel.remaining()));

          jetzt += 2000;
          check('nach Ablauf weg', ziel.get() === null);
          check('Restzeit dann 0', ziel.remaining() === 0);

          jetzt = 20000;
          ziel.set('light.kueche', 'conn-1', 'Küche');
          check('neues Ziel ersetzt das alte', ziel.get().entityId === 'light.kueche');
          check('Löschen meldet Erfolg', ziel.clear() === true);
          check('danach ist nichts gesetzt', ziel.get() === null);
          check('zweites Löschen meldet nichts', ziel.clear() === false);

          const stur = new TargetContext({ ttlMs: 1000, now: () => 0 });
          stur.on(() => { throw new Error('Horcher explodiert'); });
          stur.set('light.x', 'c');
          check('ein kaputter Horcher reißt nichts mit', stur.get().entityId === 'light.x');
        }

        section('Öffnen: Adressen nach Home Assistant');
        {
          const base = 'https://ha.example.de';
          const build = HaLinks.build;

          check(
            'Entität öffnet den Info-Dialog',
            build(base, { target: 'entity', entityId: 'light.decke_wz' }) ===
              'https://ha.example.de/?more-info-entity-id=light.decke_wz',
            build(base, { target: 'entity', entityId: 'light.decke_wz' })
          );
          check(
            'Entitäts-Id wird kodiert',
            build(base, { target: 'entity', entityId: 'sensor.a b' }).indexOf('sensor.a%20b') !== -1
          );
          check('Entität ohne Id ergibt nichts', build(base, { target: 'entity', entityId: '' }) === '');

          check(
            'Raum öffnet die Raumseite',
            build(base, { target: 'area', area: 'wohnzimmer' }) ===
              'https://ha.example.de/config/areas/area/wohnzimmer',
            build(base, { target: 'area', area: 'wohnzimmer' })
          );
          check('Raum ohne Auswahl ergibt nichts', build(base, { target: 'area', area: '' }) === '');

          check(
            'Dashboard mit Pfad',
            build(base, { target: 'dashboard', dashboard: 'mein-dash/kueche' }) ===
              'https://ha.example.de/mein-dash/kueche'
          );
          check(
            'führender Schrägstrich wird nicht verdoppelt',
            build(base, { target: 'dashboard', dashboard: '/lovelace/2' }) === 'https://ha.example.de/lovelace/2',
            build(base, { target: 'dashboard', dashboard: '/lovelace/2' })
          );
          check(
            'Dashboard ohne Angabe nimmt die Standardseite',
            build(base, { target: 'dashboard', dashboard: '' }) === 'https://ha.example.de/' + HaLinks.DEFAULT_DASHBOARD
          );
          check(
            'Schrägstrich am Serverende stört nicht',
            build('https://ha.example.de/', { target: 'dashboard', dashboard: 'x' }) === 'https://ha.example.de/x'
          );

          check(
            'freie Adresse bleibt unverändert',
            build(base, { target: 'url', url: 'http://etwas.local:8080/a?b=c' }) === 'http://etwas.local:8080/a?b=c'
          );
          check(
            'nackter Host bekommt https (sonst öffnet der Host nichts)',
            build(base, { target: 'url', url: 'beispiel.de/pfad' }) === 'https://beispiel.de/pfad'
          );
          check('freie Adresse ohne Eingabe ergibt nichts', build(base, { target: 'url', url: '' }) === '');

          check('ohne Serveradresse gibt es keine Adresse', build('', { target: 'entity', entityId: 'light.x' }) === '');
          check('unbekanntes Ziel wird als Entität behandelt', build(base, { entityId: 'light.x' }).indexOf('more-info') !== -1);

          check(
            'Beschreibung zeigt den Raumnamen',
            HaLinks.describe({ target: 'area', area: 'wz' }, { area: 'Wohnzimmer' }) === 'Wohnzimmer'
          );
        }

        section('Schreibschutz der Bibliothek');
        {
          const voll = { buttons: [{ id: 1 }], connections: [{ id: 2 }] };
          const leer = { buttons: [], connections: [] };
          check(
            'leer darf gefuellt NICHT ersetzen (so ging eine echte Bibliothek verloren)',
            mayReplaceLibrary(leer, voll) === false
          );
          check('gefuellt darf ersetzen', mayReplaceLibrary(voll, voll) === true);
          check('leer ueber leer ist erlaubt', mayReplaceLibrary(leer, leer) === true);
          check('erster Schreibvorgang ohne Vorwissen ist erlaubt', mayReplaceLibrary(voll, null) === true);
          check('leer ohne Vorwissen ist erlaubt', mayReplaceLibrary(leer, null) === true);
          check('nur eine Verbindung zaehlt schon als Inhalt', mayReplaceLibrary(leer, { buttons: [], connections: [{}] }) === false);
        }

        section('Designer-Fenster (Host-Eigenheiten)');
        {
          // Nachgebaute Host-Umgebung: alles, was das Modul anfasst, ist injizierbar.
          function harness(opts) {
            const sent = [];
            const location = {
              href: 'file:///C:/Plugins/com.ulanzi.matUlanziHa.ulanziPlugin/plugin/service.html?address=127.0.0.1&port=3906'
            };
            const view = new DesignerWindow(Object.assign({
              ud: {
                uuid: 'com.ulanzi.ulanzistudio.matUlanziHa',
                address: '127.0.0.1',
                port: 3906,
                language: 'de-DE',
                openView: (url, w, h, x, y, param) => sent.push({ url, w, h, param }),
                sendToPropertyInspector: (payload, context) => sent.push({ tell: payload, context })
              },
              location: location,
              now: () => 1000,
              // Genau wie der Hauptdienst es konfiguriert, siehe main.js.
              senderUuid: 'com.ulanzi.ulanzistudio.matUlanziHa.designer'
            }, opts || {}));
            return { view, sent };
          }

          const first = harness();
          check(
            'Pfad ist absolut (sonst liest der Host den ersten Teil als Servername)',
            first.view.viewPath() === '/C:/Plugins/com.ulanzi.matUlanziHa.ulanziPlugin/property-inspector/designer/designer.html',
            first.view.viewPath()
          );

          check('Oeffnen meldet opened', first.view.open('btn-1') === 'opened');
          check('openView wurde gerufen', first.sent.length === 1 && first.sent[0].url.indexOf('/C:/') === 0);
          check(
            'eigene UUID, KEINE Action-UUID — sonst schneidet der Host beim Schliessen den Inspector ab',
            first.sent[0].param.uuid === 'com.ulanzi.ulanzistudio.matUlanziHa.designer',
            first.sent[0].param.uuid
          );
          check('UUID ist kein Praefix einer Action', first.sent[0].param.uuid.indexOf('.toggle') === -1);
          check('Button-Id reist mit', first.sent[0].param.button === 'btn-1');
          check('eigene Identitaet per nonce', !!first.sent[0].param.nonce);
          check('Fenstergroesse mitgegeben', first.sent[0].w === 1280 && first.sent[0].h === 860);

          // Der Slot ist wiederverwendbar, seit die UUID nicht mehr kollidiert:
          // kein Reload, kein Warten, jedes weitere Oeffnen geht direkt.
          check('zweites Oeffnen geht ebenfalls direkt', first.view.open('btn-2') === 'opened');
          check('und ruft wieder openView', first.sent.length === 2);

          const alive = harness();
          alive.view.noteAlive('ctx-1');
          check('laufendes Fenster gilt als lebendig', alive.view.isAlive() === true);
          check('laufendes Fenster wird umgeschaltet, nicht doppelt geoeffnet', alive.view.open('btn-3') === 'focus');
          check(
            'es bekommt den gewuenschten Button gesagt',
            alive.sent.length === 1 && alive.sent[0].tell.response === 'designer:select' && alive.sent[0].tell.button === 'btn-3'
          );
          check('Adressat ist das Fenster', alive.sent[0].context === 'ctx-1');
          alive.view.noteClosed();
          check('geschlossenes Fenster gilt als tot', alive.view.isAlive() === false);
          check('danach wird wieder geoeffnet', alive.view.open('btn-4') === 'opened');

          // Der Host zerstoert das Fenster beim Klick auf sein X, laesst die Seite
          // aber laufen. Sie meldet sich dann als unsichtbar ab und muss vor dem
          // naechsten Oeffnen abgeraeumt werden, sonst haelt sie ewig eine
          // HA-Verbindung offen.
          const zombie = harness();
          zombie.view.noteAlive('ctx-alt');
          zombie.view.noteClosed();
          check('verwaiste Seite wird vermerkt', zombie.view.stale === 'ctx-alt');
          check('naechstes Oeffnen ist wieder erlaubt', zombie.view.open('btn-9') === 'opened');
          check(
            'die verwaiste Seite wird zum Schliessen aufgefordert',
            zombie.sent.length === 2 && zombie.sent[0].tell && zombie.sent[0].tell.response === 'designer:close',
            JSON.stringify(zombie.sent[0])
          );
          check('an die richtige Adresse', zombie.sent[0].context === 'ctx-alt');
          check('danach ist nichts mehr verwaist', zombie.view.stale === null);
          check('und ein Fenster wurde angefordert', !!zombie.sent[1].url);

          const stale = harness({ now: () => 100000 });
          stale.view.lastSeen = 1;
          check('verstummtes Fenster gilt als tot', stale.view.isAlive() === false);
        }

        const summary = document.createElement('h2');
        summary.textContent = failures === 0 ? '✓ alle Tests grün' : '✗ ' + failures + ' Test(s) fehlgeschlagen';
        summary.className = failures === 0 ? 'pass' : 'fail';
        out.prepend(summary);
        console.log(failures === 0 ? 'SELFTEST OK' : 'SELFTEST FAILED: ' + failures);
      })().catch((err) => {
        check('Testlauf abgeschlossen', false, err && err.stack ? err.stack : String(err));
        console.error(err);
      });
    </script>
  </body>
</html>
